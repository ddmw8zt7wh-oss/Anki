
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Anki Mobile</title>

  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anki">
  <meta name="theme-color" content="#121214">

  <!-- アプリアイコン (SVG埋め込み) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%232563eb'/%3E%3Cpath d='M256 120 L370 380 L310 380 L285 320 L227 320 L202 380 L142 380 Z M256 190 L240 280 L272 280 Z' fill='white'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d24;
      --card-border: #2a2e39;
      --text: #f3f4f6;
      --text-sub: #9ca3af;
      --primary: #3b82f6;
      
      --again: #ef4444;
      --hard: #f59e0b;
      --good: #3b82f6;
      --easy: #10b981;

      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      padding-top: max(var(--safe-top), 16px);
      padding-bottom: max(var(--safe-bottom), 16px);
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    /* ヘッダー */
    header {
      padding: 8px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
    .status-badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* メインコンテンツエリア */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    /* フラッシュカード本体 */
    .card-container {
      perspective: 1000px;
      flex: 1;
      min-height: 280px;
      display: flex;
    }
    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, border-color 0.2s;
    }
    .card:active { transform: scale(0.99); }
    .card-question {
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .divider {
      width: 60%;
      height: 1px;
      background: var(--card-border);
      margin: 20px 0;
    }
    .card-answer {
      font-size: 1.25rem;
      color: #93c5fd;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .card-hint {
      position: absolute;
      bottom: 16px;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* 下部アクションバー */
    .action-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-flip {
      width: 100%;
      padding: 16px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 14px;
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .btn-flip:active { background: #3f3f46; }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .rate-btn {
      border: none;
      border-radius: 14px;
      padding: 14px 4px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .rate-btn:active { opacity: 0.8; transform: scale(0.97); }
    .rate-btn .label { font-size: 0.85rem; font-weight: 700; }
    .rate-btn .time { font-size: 0.7rem; opacity: 0.85; }
    .btn-again { background: var(--again); }
    .btn-hard { background: var(--hard); }
    .btn-good { background: var(--good); }
    .btn-easy { background: var(--easy); }

    /* 折りたたみメニュー (追加・一覧・バックアップ) */
    details {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
    }
    summary {
      padding: 14px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after {
      content: "+";
      font-size: 1.1rem;
    }
    details[open] summary::after {
      content: "−";
    }
    .drawer-content {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea, input {
      width: 100%;
      background: #111317;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      color: white;
      font-size: 0.95rem;
      user-select: text;
      -webkit-user-select: text;
    }
    textarea:focus, input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn-submit:active { opacity: 0.8; }

    /* カード一覧・検索エリア */
    .search-input {
      margin-bottom: 8px;
    }
    .cards-container {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }
    .card-item {
      background: #111317;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text;
      -webkit-user-select: text;
    }
    .card-item-front {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }
    .card-item-back {
      font-size: 0.8rem;
      color: #93c5fd;
      word-break: break-word;
    }
    .card-item-meta {
      font-size: 0.7rem;
      color: var(--text-sub);
    }
    .btn-delete {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-delete:active {
      background: #ef4444;
      color: white;
    }
    .empty-notice {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
      padding: 16px 0;
    }

    .deck-stats {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
    }
    .btn-util {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">Anki</div>
    <div id="badge-status" class="status-badge">復習: 0</div>
  </header>

  <main>
    <!-- カード学習領域 -->
    <div class="card-container">
      <div id="card-box" class="card" onclick="handleCardClick()">
        <div id="card-front" class="card-question">読み込み中...</div>
        <div id="card-sep" class="divider hidden"></div>
        <div id="card-back" class="card-answer hidden"></div>
        <div id="card-hint" class="card-hint">タップして解答を表示</div>
      </div>
    </div>

    <!-- アクションボタン領域 (下部固定) -->
    <div class="action-container">
      <button id="btn-show" class="btn-flip" onclick="flipCard()">答えを表示</button>

      <div id="rating-bar" class="rating-grid hidden">
        <button class="rate-btn btn-again" onclick="rate(1)">
          <span class="label">やり直し</span>
          <span id="t-again" class="time">1日</span>
        </button>
        <button class="rate-btn btn-hard" onclick="rate(2)">
          <span class="label">難しい</span>
          <span id="t-hard" class="time">2日</span>
        </button>
        <button class="rate-btn btn-good" onclick="rate(3)">
          <span class="label">普通</span>
          <span id="t-good" class="time">4日</span>
        </button>
        <button class="rate-btn btn-easy" onclick="rate(4)">
          <span class="label">簡単</span>
          <span id="t-easy" class="time">7日</span>
        </button>
      </div>
    </div>

    <!-- 1 保存済みカード一覧・確認 (新機能) -->
    <details id="details-list">
      <summary id="summary-cards">保存済みカード一覧 (0件)</summary>
      <div class="drawer-content">
        <input type="text" id="search-input" class="search-input" placeholder="カードを検索..." oninput="renderCardList()">
        <div id="cards-container" class="cards-container">
          <!-- カードリストが動的に入ります -->
        </div>
      </div>
    </details>

    <!-- カード追加ドロワー -->
    <details>
      <summary>カードを新規追加</summary>
      <div class="drawer-content">
        <textarea id="in-front" rows="2" placeholder="表面(質問・単語)"></textarea>
        <textarea id="in-back" rows="2" placeholder="裏面(答え・解説)"></textarea>
        <button class="btn-submit" onclick="addCard()">追加する</button>
      </div>
    </details>

    <!-- データ管理ドロワー -->
    <details>
      <summary>データ管理・バックアップ</summary>
      <div class="drawer-content">
        <div class="deck-stats">
          <span id="stat-total">全カード: 0</span>
          <span id="stat-due">期日超過: 0</span>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn-util" style="flex:1" onclick="exportData()">JSON書出</button>
          <button class="btn-util" style="flex:1" onclick="document.getElementById('import-file').click()">JSON読込</button>
          <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
        </div>
      </div>
    </details>
  </main>

  <script>
    const STORAGE_KEY = "anki_ios_pwa_v1";
    let cards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let queue = [];
    let current = null;
    let isFlipped = false;

    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      updateStatus();
      renderCardList();
    }

    // SM-2 アルゴリズム
    function calcSM2(card, grade) {
      let reps = card.reps;
      let interval = card.interval;
      let ease = card.easeFactor;

      if (grade === 1) { // Again
        reps = 0;
        interval = 1;
        ease = Math.max(1.3, ease - 0.2);
      } else {
        if (grade === 2) { // Hard
          interval = Math.max(1, Math.round(interval * 1.2));
          ease = Math.max(1.3, ease - 0.15);
        } else if (grade === 3) { // Good
          if (reps === 0) interval = 1;
          else if (reps === 1) interval = 6;
          else interval = Math.round(interval * ease);
          reps += 1;
        } else if (grade === 4) { // Easy
          if (reps === 0) interval = 4;
          else if (reps === 1) interval = 10;
          else interval = Math.round(interval * ease * 1.3);
          ease += 0.15;
          reps += 1;
        }
      }

      const next = new Date();
      next.setDate(next.getDate() + interval);
      const dueDate = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;

      return { reps, interval, easeFactor: Number(ease.toFixed(2)), dueDate };
    }

    function initDeck() {
      const today = getToday();
      queue = cards.filter(c => c.dueDate <= today);
      renderCard();
      renderCardList();
    }

    function renderCard() {
      isFlipped = false;
      document.getElementById("card-sep").classList.add("hidden");
      document.getElementById("card-back").classList.add("hidden");
      document.getElementById("rating-bar").classList.add("hidden");
      document.getElementById("btn-show").classList.remove("hidden");
      document.getElementById("card-hint").classList.remove("hidden");

      if (queue.length > 0) {
        current = queue[0];
        document.getElementById("card-front").textContent = current.front;
        document.getElementById("card-back").textContent = current.back;

        // 次回予測間隔をボタンに反映
        document.getElementById("t-again").textContent = `${calcSM2(current, 1).interval}日`;
        document.getElementById("t-hard").textContent = `${calcSM2(current, 2).interval}日`;
        document.getElementById("t-good").textContent = `${calcSM2(current, 3).interval}日`;
        document.getElementById("t-easy").textContent = `${calcSM2(current, 4).interval}日`;
      } else {
        current = null;
        document.getElementById("card-front").textContent = cards.length === 0 
          ? "カードがありません。「+」から追加してください。" 
          : "🎉 本日の復習は完了しました!";
        document.getElementById("btn-show").classList.add("hidden");
        document.getElementById("card-hint").classList.add("hidden");
      }
      updateStatus();
    }

    function handleCardClick() {
      if (!isFlipped && current) flipCard();
    }

    function flipCard() {
      if (!current || isFlipped) return;
      isFlipped = true;
      document.getElementById("card-sep").classList.remove("hidden");
      document.getElementById("card-back").classList.remove("hidden");
      document.getElementById("rating-bar").classList.remove("hidden");
      document.getElementById("btn-show").classList.add("hidden");
      document.getElementById("card-hint").classList.add("hidden");
    }

    function rate(grade) {
      if (!current || !isFlipped) return;
      const updated = calcSM2(current, grade);
      Object.assign(current, updated);

      queue.shift();
      if (grade === 1) queue.push(current);

      save();
      renderCard();
    }

    function addCard() {
      const front = document.getElementById("in-front").value.trim();
      const back = document.getElementById("in-back").value.trim();
      if (!front || !back) return alert("表面・裏面を入力してください");

      cards.push({
        id: "c_" + Date.now(),
        front,
        back,
        reps: 0,
        interval: 0,
        easeFactor: 2.5,
        dueDate: getToday()
      });

      document.getElementById("in-front").value = "";
      document.getElementById("in-back").value = "";
      save();
      initDeck();
    }

    function deleteCard(id) {
      if (!confirm("このカードを削除しますか?")) return;
      cards = cards.filter(c => c.id !== id);
      save();
      initDeck();
    }

    // 1 保存カード一覧・検索のレンダリング
    function renderCardList() {
      const container = document.getElementById("cards-container");
      const query = (document.getElementById("search-input")?.value || "").toLowerCase().trim();
      document.getElementById("summary-cards").textContent = `保存済みカード一覧 (${cards.length}件)`;

      const filtered = cards.filter(c => 
        c.front.toLowerCase().includes(query) || 
        c.back.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-notice">${cards.length === 0 ? "保存されているカードはありません" : "一致するカードがありません"}</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => `
        <div class="card-item">
          <div class="card-item-info">
            <div class="card-item-front">${escapeHTML(c.front)}</div>
            <div class="card-item-back">${escapeHTML(c.back)}</div>
            <div class="card-item-meta">次回期日: ${c.dueDate} (${c.interval}日後) | 正解: ${c.reps}回</div>
          </div>
          <button class="btn-delete" onclick="deleteCard('${c.id}')">削除</button>
        </div>
      `).join("");
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function updateStatus() {
      const today = getToday();
      const due = cards.filter(c => c.dueDate <= today).length;
      document.getElementById("badge-status").textContent = `復習: ${due}`;
      document.getElementById("stat-total").textContent = `全カード: ${cards.length}`;
      document.getElementById("stat-due").textContent = `期日: ${due}`;
    }

    // バックアップ機能
    function exportData() {
      const blob = new Blob([JSON.stringify(cards, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `anki_backup_${getToday()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            cards = imported;
            save();
            initDeck();
            alert("復元が完了しました");
          }
        } catch {
          alert("不正なJSONファイルです");
        }
      };
      reader.readAsText(file);
    }

    // 初期サンプル
    if (cards.length === 0) {
      cards = [
        { id: "1", front: "Apple Silicon の Mシリーズ初号機は?", back: "M1", reps: 0, interval: 0, easeFactor: 2.5, dueDate: getToday() },
        { id: "2", front: "Spaced Repetition とは?", back: "忘却曲線に合わせて復習間隔を延ばす分散学習法", reps: 0, interval: 0, easeFactor: 2.5, dueDate: getToday() }
      ];
      save();
    }

    initDeck();
  </script>
</body>
</html>
